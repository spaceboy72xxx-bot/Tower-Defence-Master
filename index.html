<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini MOBA - Isometric Touch</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #gameCanvas {
            display: block;
            background: #1e293b;
        }
        /* HUD & UI Overlay */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .hud-box {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #playerStats {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .bar-container {
            width: 100px;
            height: 10px;
            background: #334155;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 3px;
        }
        #hpFill { height: 100%; background: #22c55e; width: 100%; transition: width 0.1s; }
        #mpFill { height: 100%; background: #3b82f6; width: 100%; transition: width 0.1s; }

        /* Touch Controls */
        #touchOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        .joystick-base {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .joystick-stick {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
            transition: transform 0.05s linear;
        }
        .skill-pad {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: grid;
            grid-template-columns: repeat(3, 65px);
            gap: 10px;
            pointer-events: auto;
        }
        .skill-btn {
            width: 65px;
            height: 65px;
            background: rgba(30, 41, 59, 0.85);
            border: 2px solid #475569;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        .skill-btn:active {
            background: rgba(71, 85, 105, 0.9);
            transform: scale(0.95);
        }
        .skill-btn span { font-size: 10px; color: #94a3b8; margin-top: 2px; }
        .cooldown-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            height: 0%;
        }
        #atkBtn {
            grid-column: span 3;
            height: 50px;
            background: rgba(220, 38, 38, 0.8);
            border-color: #ef4444;
            border-radius: 10px;
            font-size: 14px;
        }

        /* Minimap */
        #minimapCanvas {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 130px;
            height: 130px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-box" id="playerStats">
            <div>
                <strong id="heroName">Mage Hero</strong> [Lvl <span id="heroLvl">1</span>]
                <div>HP: <span id="hpText">100/100</span></div>
                <div class="bar-container"><div id="hpFill"></div></div>
                <div>MP: <span id="mpText">50/50</span></div>
                <div class="bar-container"><div id="mpFill"></div></div>
            </div>
            <div>
                <div>Gold: 💰 <span id="goldVal">500</span></div>
                <div>KDA: <span id="kdaVal">0/0/0</span></div>
            </div>
        </div>
    </div>

    <canvas id="minimapCanvas" width="130" height="130"></canvas>
    <canvas id="gameCanvas"></canvas>

    <div id="touchOverlay">
        <div class="joystick-base" id="joyBase">
            <div class="joystick-stick" id="joyStick"></div>
        </div>
        <div class="skill-pad">
            <button class="skill-btn" id="btnQ" ontouchstart="castSkill('Q')">Q<span>Arcane</span><div class="cooldown-overlay" id="cdQ"></div></button>
            <button class="skill-btn" id="btnW" ontouchstart="castSkill('W')">W<span>Dash</span><div class="cooldown-overlay" id="cdW"></div></button>
            <button class="skill-btn" id="btnE" ontouchstart="castSkill('E')">E<span>Stun</span><div class="cooldown-overlay" id="cdE"></div></button>
            <button class="skill-btn" id="btnR" ontouchstart="castSkill('R')">R<span>Laser</span><div class="cooldown-overlay" id="cdR"></div></button>
            <button class="skill-btn" id="atkBtn" ontouchstart="triggerBasicAttack()">🗡️ AUTO ATTACK / TARGET</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const miniCanvas = document.getElementById('minimapCanvas');
        const miniCtx = miniCanvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Context (Synthesizer SFX)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'spell') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(20, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        window.addEventListener('pointerdown', initAudio, { once: true });

        // World Config (Isometric Diagonal Map)
        const MAP_WIDTH = 2400;
        const MAP_HEIGHT = 2400;

        // Game Entities
        let player = {
            x: 400, y: 2000, vx: 0, vy: 0, speed: 3.5,
            hp: 200, maxHp: 200, mp: 100, maxMp: 100,
            level: 1, exp: 0, gold: 500, kills: 0, deaths: 0, assists: 0,
            radius: 18, team: 'blue', range: 250, atkCd: 0,
            cds: { Q: 0, W: 0, E: 0, R: 0 }
        };

        let aiHero = {
            x: 2000, y: 400, vx: 0, vy: 0, speed: 3.0,
            hp: 200, maxHp: 200, level: 1, radius: 18, team: 'red',
            range: 250, atkCd: 0, state: 'idle', targetX: 2000, targetY: 400
        };

        let minions = [];
        let towers = [
            { x: 700, y: 1700, hp: 500, maxHp: 500, team: 'blue', range: 350, atkCd: 0 },
            { x: 1700, y: 700, hp: 500, maxHp: 500, team: 'red', range: 350, atkCd: 0 }
        ];
        let nexus = [
            { x: 300, y: 2100, hp: 1200, maxHp: 1200, team: 'blue' },
            { x: 2100, y: 300, hp: 1200, maxHp: 1200, team: 'red' }
        ];
        let projectiles = [];
        let particles = [];
        let floatingTexts = [];

        // Isometric Conversion Function
        function toIsometric(x, y) {
            return {
                isoX: (x - y) * 0.707,
                isoY: (x + y) * 0.353
            };
        }

        // Joystick Logic
        let joyActive = false, joyVector = { x: 0, y: 0 };
        const joyBase = document.getElementById('joyBase');
        const joyStick = document.getElementById('joyStick');
        let joyCenter = { x: 0, y: 0 };

        joyBase.addEventListener('pointerdown', (e) => {
            joyActive = true;
            const rect = joyBase.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            updateJoystick(e.clientX, e.clientY);
        });
        window.addEventListener('pointermove', (e) => {
            if (!joyActive) return;
            updateJoystick(e.clientX, e.clientY);
        });
        window.addEventListener('pointerup', () => {
            joyActive = false;
            joyVector = { x: 0, y: 0 };
            joyStick.style.transform = `translate(0px, 0px)`;
        });

        function updateJoystick(clientX, clientY) {
            let dx = clientX - joyCenter.x;
            let dy = clientY - joyCenter.y;
            let dist = Math.hypot(dx, dy);
            let maxDist = 45;
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joyVector = { x: dx / maxDist, y: dy / maxDist };
        }

        // Skill casting buttons
        function castSkill(type) {
            if (player.cds[type] > 0) return;
            playSound('spell');

            if (type === 'Q' && player.mp >= 20) {
                player.mp -= 20; player.cds.Q = 3;
                projectiles.push({ x: player.x, y: player.y, vx: 8, vy: -8, range: 400, dmg: 40, team: 'blue', type: 'skillshot' });
            } else if (type === 'W' && player.mp >= 15) {
                player.mp -= 15; player.cds.W = 5;
                player.x += joyVector.x * 120 || 50; player.y += joyVector.y * 120 || -50;
            } else if (type === 'E' && player.mp >= 30) {
                player.mp -= 30; player.cds.E = 8;
                // AOE Stun around player
                [aiHero, ...minions].forEach(target => {
                    if (target.team !== player.team && Math.hypot(target.x - player.x, target.y - player.y) < 180) {
                        target.hp -= 50;
                        target.stunned = 90; // 1.5 secs stun
                        showFloatingText("-50 STUN", target.x, target.y, '#f59e0b');
                    }
                });
            } else if (type === 'R' && player.mp >= 50) {
                player.mp -= 50; player.cds.R = 15;
                projectiles.push({ x: player.x, y: player.y, vx: 12, vy: -12, range: 600, dmg: 120, team: 'blue', type: 'laser' });
            }
        }

        function triggerBasicAttack() {
            if (player.atkCd > 0) return;
            player.atkCd = 30;
            playSound('hit');
            projectiles.push({ x: player.x, y: player.y, vx: 6, vy: -6, range: 300, dmg: 25, team: 'blue', type: 'basic' });
        }

        function showFloatingText(text, x, y, color) {
            floatingTexts.push({ text, x, y, vy: -1, alpha: 1.0, color });
        }

        // Minion Spawner
        let spawnTimer = 0;
        function spawnMinions() {
            // Blue minion
            minions.push({ x: 300, y: 2000, hp: 60, maxHp: 60, team: 'blue', speed: 1.5, range: 150, atkCd: 0 });
            // Red minion
            minions.push({ x: 2100, y: 400, hp: 60, maxHp: 60, team: 'red', speed: 1.5, range: 150, atkCd: 0 });
        }

        // Game Loop Update
        function update() {
            // Cooldown ticks
            ['Q', 'W', 'E', 'R'].forEach(k => { if (player.cds[k] > 0) player.cds[k] -= 1/60; });
            if (player.atkCd > 0) player.atkCd--;

            // Player Movement via Joystick
            if (joyVector.x !== 0 || joyVector.y !== 0) {
                player.x += joyVector.x * player.speed;
                player.y += joyVector.y * player.speed;
                // Boundary clamp
                player.x = Math.max(100, Math.min(MAP_WIDTH - 100, player.x));
                player.y = Math.max(100, Math.min(MAP_HEIGHT - 100, player.y));
            }

            // AI Hero Logic
            if (aiHero.hp > 0) {
                let distToPlayer = Math.hypot(player.x - aiHero.x, player.y - aiHero.y);
                if (distToPlayer < 400) {
                    aiHero.x += (player.x > aiHero.x ? 1 : -1) * aiHero.speed * 0.7;
                    aiHero.y += (player.y > aiHero.y ? 1 : -1) * aiHero.speed * 0.7;
                    if (aiHero.atkCd <= 0 && distToPlayer < aiHero.range) {
                        aiHero.atkCd = 45;
                        playSound('hit');
                        player.hp -= 15;
                        showFloatingText("-15", player.x, player.y, '#ef4444');
                    }
                } else {
                    // Walk towards blue nexus lane
                    aiHero.x -= 0.5; aiHero.y += 0.5;
                }
                if (aiHero.atkCd > 0) aiHero.atkCd--;
            }

            // Minions logic
            minions.forEach((m, idx) => {
                let targetX = m.team === 'blue' ? 2100 : 300;
                let targetY = m.team === 'blue' ? 300 : 2100;
                let angle = Math.atan2(targetY - m.y, targetX - m.x);
                m.x += Math.cos(angle) * m.speed;
                m.y += Math.sin(angle) * m.speed;

                // Attack enemies in range
                let enemies = m.team === 'blue' ? [aiHero, ...minions.filter(x=>x.team==='red')] : [player, ...minions.filter(x=>x.team==='blue')];
                enemies.forEach(en => {
                    if (en && Math.hypot(en.x - m.x, en.y - m.y) < m.range) {
                        if (m.atkCd <= 0) {
                            m.atkCd = 60;
                            en.hp -= 10;
                            showFloatingText("-10", en.x, en.y, '#f87171');
                        }
                    }
                });
                if (m.atkCd > 0) m.atkCd--;
                if (m.hp <= 0) minions.splice(idx, 1);
            });

            // Projectiles update
            projectiles.forEach((p, idx) => {
                p.x += p.vx; p.y += p.vy;
                p.range -= Math.hypot(p.vx, p.vy);

                let targets = p.team === 'blue' ? [aiHero, ...minions.filter(x=>x.team==='red')] : [player, ...minions.filter(x=>x.team==='blue')];
                targets.forEach(t => {
                    if (t && Math.hypot(t.x - p.x, t.y - p.y) < 25) {
                        t.hp -= p.dmg;
                        showFloatingText(`-${p.dmg}`, t.x, t.y, '#facc15');
                        playSound('hit');
                        projectiles.splice(idx, 1);
                    }
                });
                if (p.range <= 0) projectiles.splice(idx, 1);
            });

            // Spawner tick
            spawnTimer++;
            if (spawnTimer > 720) { // every 12 seconds
                spawnMinions();
                spawnTimer = 0;
            }

            // HUD update
            document.getElementById('hpText').innerText = `${Math.max(0, Math.floor(player.hp))}/${player.maxHp}`;
            document.getElementById('hpFill').style.width = `${(player.hp / player.maxHp) * 100}%`;
            document.getElementById('mpText').innerText = `${Math.floor(player.mp)}/${player.maxMp}`;
            document.getElementById('mpFill').style.width = `${(player.mp / player.maxMp) * 100}%`;
            document.getElementById('goldVal').innerText = player.gold;

            // Skill CD UI updates
            ['Q', 'W', 'E', 'R'].forEach(k => {
                let cdElem = document.getElementById(`cd${k}`);
                let maxCd = k === 'Q' ? 3 : k === 'W' ? 5 : k === 'E' ? 8 : 15;
                let pct = (player.cds[k] / maxCd) * 100;
                cdElem.style.height = `${pct}%`;
            });
        }

        // Render Game
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);

            ctx.save();
            // Camera follow player, centered
            let camX = canvas.width / 2 - player.x;
            let camY = canvas.height / 2 - player.y;
            ctx.translate(camX, camY);

            // Draw Isometric Grid & Lane background
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i <= MAP_WIDTH; i += 300) {
                ctx.moveTo(i, 0); ctx.lineTo(i, MAP_HEIGHT);
                ctx.moveTo(0, i); ctx.lineTo(MAP_WIDTH, i);
            }
            ctx.stroke();

            // Draw Diagonal Lane Line
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 80;
            ctx.beginPath();
            ctx.moveTo(300, 2100); ctx.lineTo(2100, 300);
            ctx.stroke();

            // Draw Nexus
            nexus.forEach(n => {
                ctx.fillStyle = n.team === 'blue' ? '#3b82f6' : '#ef4444';
                ctx.beginPath(); ctx.arc(n.x, n.y, 35, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
            });

            // Draw Towers
            towers.forEach(t => {
                ctx.fillStyle = t.team === 'blue' ? '#60a5fa' : '#f87171';
                ctx.beginPath(); ctx.arc(t.x, t.y, 25, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
            });

            // Draw Minions
            minions.forEach(m => {
                ctx.fillStyle = m.team === 'blue' ? '#93c5fd' : '#fca5a5';
                ctx.beginPath(); ctx.arc(m.x, m.y, 10, 0, Math.PI * 2); ctx.fill();
            });

            // Draw AI Hero
            if (aiHero.hp > 0) {
                ctx.fillStyle = '#dc2626';
                ctx.beginPath(); ctx.arc(aiHero.x, aiHero.y, aiHero.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            }

            // Draw Player Hero
            ctx.fillStyle = '#2563eb';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();

            // Draw Projectiles
            projectiles.forEach(p => {
                ctx.fillStyle = p.team === 'blue' ? '#60a5fa' : '#f87171';
                ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill();
            });

            // Draw Floating Texts
            floatingTexts.forEach((ft, idx) => {
                ft.y += ft.vy; ft.alpha -= 0.02;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 16px sans-serif';
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1.0;
                if (ft.alpha <= 0) floatingTexts.splice(idx, 1);
            });

            ctx.restore();

            // Minimap Draw
            let scaleX = miniCanvas.width / MAP_WIDTH;
            let scaleY = miniCanvas.height / MAP_HEIGHT;
            miniCtx.fillStyle = '#1e293b'; miniCtx.fillRect(0, 0, miniCanvas.width, miniCanvas.height);
            miniCtx.fillStyle = '#3b82f6'; miniCtx.fillRect(player.x * scaleX - 3, player.y * scaleY - 3, 6, 6);
            if (aiHero.hp > 0) {
                miniCtx.fillStyle = '#ef4444'; miniCtx.fillRect(aiHero.x * scaleX - 3, aiHero.y * scaleY - 3, 6, 6);
            }
        }

        // Main Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        spawnMinions();
        loop();
    </script>
</body>
</html>
